[workspace]
resolver = "3"
members = ["crates/core", "crates/formats", "crates/net", "crates/cli", "app/src-tauri", "tools/printer-cam"]
default-members = ["crates/core", "crates/formats", "crates/net", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/openresin/openresin"
rust-version = "1.85"

[workspace.dependencies]
openresin-core = { path = "crates/core" }
openresin-formats = { path = "crates/formats" }
openresin-net = { path = "crates/net" }
glam = { version = "0.29", features = ["serde"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"

[profile.dev]
opt-level = 1
# rustc's incremental mode occasionally emits unresolved `anon.*.llvm` symbols
# when linking the app's cdylib with optimised dependencies; keep it off.
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
